version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: intellicore_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intellicore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: intellicore_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    build:
      context: ./express-backend
      dockerfile: Dockerfile
    container_name: intellicore_backend
    volumes:
      - ./express-backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/intellicore
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - JWT_SECRET=supersecret
      - PORT=8001
    ports:
      - "8001:8001"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./express-backend
      dockerfile: Dockerfile
    container_name: intellicore_worker
    volumes:
      - ./express-backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/intellicore
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    command: npm run worker
    depends_on:
      - db
      - redis
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intellicore_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8001/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
