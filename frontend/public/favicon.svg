<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="ringGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Ring 1 -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="url(#ringGradient)" stroke-width="12" stroke-dasharray="140 40" stroke-linecap="round" transform="rotate(45 128 128)" opacity="0.8" />
  <!-- Outer Ring 2 -->
  <circle cx="128" cy="128" r="70" fill="none" stroke="url(#coreGradient)" stroke-width="12" stroke-dasharray="100 30" stroke-linecap="round" transform="rotate(-30 128 128)" opacity="0.9" />
  <!-- Core Node -->
  <circle cx="128" cy="128" r="40" fill="url(#coreGradient)" filter="url(#glow)" />
  <!-- Inner Star/Sparkle -->
  <path d="M128 100 L135 120 L155 128 L135 136 L128 156 L121 136 L101 128 L121 120 Z" fill="#ffffff" />
</svg>